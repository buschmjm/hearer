name: Release

# release-please keeps a release pull request open on main. Merging it tags the release and
# creates the GitHub release; the image job then builds and publishes the multi-arch image.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Release PR and tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Pull requests opened with the default token do not trigger CI. To get CI on the
          # release PR, add a personal access token or app token as RELEASE_PLEASE_TOKEN.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  image:
    name: Publish image ${{ needs.release-please.outputs.version }}
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Push to GHCR.
      packages: write
      # Provenance and SBOM attestations are signed with the workflow's OIDC identity.
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # APP_VERSION is compiled into the server bundle (User-Agent, /health). release-please
      # rewrites it in the release PR; refuse to publish an image whose version disagrees.
      - name: Check APP_VERSION matches the release
        run: |
          set -eu
          found="$(sed -n "s/^export const APP_VERSION = '\([^']*\)'.*/\1/p" packages/shared/src/index.ts)"
          if [ "$found" != "$VERSION" ]; then
            echo "::error::APP_VERSION is '$found' but the release is '$VERSION'"
            exit 1
          fi

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hearer" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # X.Y.Z, X.Y, X (not for 0.x: 0 is not a stable major) and latest (not for pre-releases).
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }},enable=${{ needs.release-please.outputs.major != '0' }}
            type=raw,value=latest,enable=${{ !contains(env.VERSION, '-') }}
          labels: |
            org.opencontainers.image.title=Hearer
            org.opencontainers.image.description=Self-hosted music request and upload portal.
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64, arm64)
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SBOM and SLSA provenance are attached to the image index as OCI attestations.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=hearer
          cache-to: type=gha,scope=hearer,mode=max

      # Also publish the provenance as a GitHub attestation, so `gh attestation verify` works.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
