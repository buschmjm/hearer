name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter server db:check

  docker:
    name: Docker image
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      # Needed only to push the image (pushes to main). Pull requests from
      # forks always get a read-only token regardless of this setting.
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hearer" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=edge,branch=main
            type=sha,format=short
            type=ref,event=pr

      # Single-arch build loaded into the local Docker daemon for the smoke test.
      - name: Build (amd64, for smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: hearer:smoke
          cache-from: type=gha,scope=hearer
          cache-to: type=gha,scope=hearer,mode=max

      - name: Smoke test, tools
        run: docker run --rm hearer:smoke sh -c 'ffprobe -version && fpcalc -version'

      - name: Smoke test, boot and health
        run: |
          set -eu
          data="$(mktemp -d)"
          cid="$(docker run -d -e PUID=1234 -e PGID=1234 -p 127.0.0.1:5055:5055 \
            -v "$data:/data" hearer:smoke)"
          dump_logs() { docker logs "$cid" || true; }
          cleanup() { docker rm -f "$cid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          healthy=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5055/api/v1/health; then
              healthy=1
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$cid")" != "true" ]; then
              break
            fi
            sleep 1
          done
          echo
          if [ "$healthy" -ne 1 ]; then
            echo "::error::health endpoint did not become ready within 30s"
            dump_logs
            exit 1
          fi

          # The app must run as PUID, not root.
          uid="$(docker exec "$cid" stat -c %u /data/hearer.db)"
          if [ "$uid" != "1234" ]; then
            echo "::error::/data/hearer.db owned by uid $uid, expected 1234"
            dump_logs
            exit 1
          fi
          proc="$(docker exec "$cid" ps -o user,args | grep '[d]ist/index.js' || true)"
          echo "process: $proc"
          case "$proc" in
            hearer*) ;;
            *)
              echo "::error::server process is not running as the hearer user"
              dump_logs
              exit 1
              ;;
          esac

      - name: Smoke test, non-root start (--user)
        run: |
          set -eu
          data="$(mktemp -d)"
          chmod 777 "$data"
          cid="$(docker run -d --user 4321:4321 -p 127.0.0.1:5056:5055 \
            -v "$data:/data" hearer:smoke)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5056/api/v1/health; then
              echo
              exit 0
            fi
            sleep 1
          done
          echo "::error::container started with --user did not become healthy"
          docker logs "$cid" || true
          exit 1

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (multi-arch)
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=hearer
          cache-to: type=gha,scope=hearer,mode=max
